# Production-like deployment example — multi-stage images, nginx on 127.0.0.1:8080.
# Use with: docker compose -f docker-compose.prod.example.yml up --build -d

services:
  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
    env_file:
      - ./.env
    environment:
      HOST: "0.0.0.0"
    volumes:
      # Daily request logs, pruned automatically after 9 days.
      - backend-logs:/app/logs
    logging: &capped-logging
      # Request logs go to files (above); stdout only carries startup and crash
      # output. Cap it so container logs cannot grow without bound.
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    expose:
      - "3000"
    # Intentionally no `ports:` mapping - the backend must only be reachable
    # from other containers on `steamstats-net` (via the frontend's nginx
    # reverse proxy), never directly from the host or the public internet.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - steamstats-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/dockerfile
    ports:
      # Loopback only so Cloudflare Tunnel can reach nginx without publishing
      # HTTP on the host WAN (a common cause of "HTTP port open" scan findings).
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    logging: *capped-logging
    networks:
      - steamstats-net
    restart: unless-stopped

volumes:
  backend-logs:

networks:
  steamstats-net:
    driver: bridge
