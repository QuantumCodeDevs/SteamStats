worker_processes auto;
pid /tmp/nginx.pid;
# Only critical errors: lower levels include client IPs, and the backend
# already logs API requests with a 9-day retention limit.
error_log /var/log/nginx/error.log crit;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # No access log: the official image sends it to stdout, where Docker would
  # keep visitor IPs indefinitely. API requests are logged by the backend.
  access_log off;

  sendfile on;
  keepalive_timeout 65;

  include /etc/nginx/conf.d/*.conf;
}
